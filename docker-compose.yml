x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: airflow-service:3.2.2-chromium
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER}:admin"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__EXPOSE_CONFIG: "True"
    PYTHONPATH: /opt/airflow
    BOOKSTACK_URL: ${BOOKSTACK_URL}
    BOOKSTACK_DB_HOST: mariadb_service
    BOOKSTACK_DB_NAME: bookstack_service
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    MARIADB_HOST: ${MARIADB_HOST}
  volumes:
  - ./airflow/dags:/opt/airflow/dags
  - ./airflow/logs:/opt/airflow/logs
  - ./airflow/plugins:/opt/airflow/plugins
  - ./bookstack/include:/opt/airflow/include    
  - ./bookstack/dados:/opt/airflow/dados        
  - ./bookstack/backups:/opt/airflow/backups      
  networks:
    - service_net
  depends_on:
    postgres:
      condition: service_healthy

services:
  mariadb_service:
    image: mariadb:11.4.9
    container_name: mariadb_service
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: bookstack_service
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-file-per-table=1
      - --max_allowed_packet=64M
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d
    networks:
      - service_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 190s
      
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    environment:
      NEO4J_AUTH: "${DB_NEO4J_USER}/${DB_NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
      NEO4J_apoc_import_file_enabled: true
      NEO4J_apoc_import_file_use_neo4j_config: true
    expose:
      - "7474"
      - "7687"
    ports:
      - "7687:7687"
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/import:/import
      - ./neo4j/plugins:/plugins
    restart: unless-stopped
    networks:
      - service_net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${DB_NEO4J_USER} -p '${DB_NEO4J_PASSWORD}' 'RETURN 1;' || exit 1"]
      start_period: 90s
      interval: 10s
      timeout: 10s
      retries: 10

  neo4j-init:
    image: neo4j:latest
    container_name: neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - service_net
    volumes:
      - ./neo4j/scripts/:/scripts/
    entrypoint: ["/bin/bash", "/scripts/init.sh"]

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    depends_on:
      mariadb_service:
        condition: service_healthy
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Sao_Paulo
      APP_URL: ${BOOKSTACK_APP_URL}
      APP_KEY: ${BOOKSTACK_APP_KEY}
      DB_HOST: ${DB_BOOKSTACK_HOST}
      DB_PORT: 3306
      DB_USERNAME: ${DB_BOOKSTACK_USER}
      DB_PASSWORD: ${DB_BOOKSTACK_PASSWORD}
      DB_DATABASE: ${DB_BOOKSTACK_DATABASE}
    volumes:
      - bookstack_service_config:/config
    networks:
      - service_net
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
  
  fastapi:
    image: fastapi-smsub:1.0
    container_name: fastapi
    build:
      context: ./fastapi
      dockerfile: Dockerfile  
    depends_on:
      mariadb_service:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: ${DB_NEO4J_URI}
      NEO4J_USER: ${DB_NEO4J_USER}
      NEO4J_PASSWORD: ${DB_NEO4J_PASSWORD}
    networks:
      - service_net
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - service_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init_service
    user: "${AIRFLOW_UID}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - exec /entrypoint airflow db migrate
   
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver_service
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID}:0"
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    shm_size: '2gb'
    container_name: airflow-scheduler_service
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID}:0"
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
   
  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor_service
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID}:0"
    command: dag-processor
    restart: unless-stopped
   
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-service
    restart: unless-stopped
    depends_on:
      bookstack:
        condition: service_healthy
      fastapi:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - service_net

volumes:
  mariadb_data:
  bookstack_service_config:
  postgres_data:

networks:
  service_net:
    name: service_net
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400